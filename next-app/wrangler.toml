# Bakery Khunkai — ใช้ไฟล์นี้เฉพาะสำหรับคำสั่ง `wrangler d1 execute` (รัน migration ผ่าน CLI)
# เท่านั้น ไม่เกี่ยวกับการ deploy อีกต่อไป (แอปรันบน Vercel แล้ว ไม่ใช่ Cloudflare Pages)
# wrangler ใช้ database_name ในนี้เพื่อเดา database_id ให้เวลารันคำสั่ง db:migrate / db:migrate:local
name = "bakerykhunkai-management"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "bakery-khunkai-db"
database_id = "d30092a6-7a97-4346-93c8-d918e10a6992"
