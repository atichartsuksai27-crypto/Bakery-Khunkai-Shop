<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>เข้าสู่ระบบ — Bakery By Khunkai</title>
<link rel="icon" href="assets/img/logo-mark.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/img/logo-mark.png" alt="Bakery By Khunkai"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🧁',style:'font-size:32px'}))">
    </div>
    <h1>Bakery By Khunkai</h1>
    <p class="auth-sub">เข้าสู่ระบบสูตรและต้นทุนขนม · ใช้ภายในองค์กร</p>

    <div class="auth-error" id="authError"></div>

    <form class="auth-form" id="loginForm" autocomplete="off">
      <div>
        <label class="field" for="username">ชื่อผู้ใช้</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div>
        <label class="field" for="password">รหัสผ่าน</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary auth-submit" id="submitBtn">เข้าสู่ระบบ</button>
    </form>

    <p class="auth-foot">สำหรับพนักงานที่ได้รับสิทธิ์เท่านั้น</p>
  </div>
</main>

<script>
(function () {
  'use strict';
  var form = document.getElementById('loginForm');
  var errEl = document.getElementById('authError');
  var btn = document.getElementById('submitBtn');

  function showError(msg) {
    errEl.textContent = msg;
    errEl.classList.add('show');
  }

  function safeNext() {
    var next = new URLSearchParams(location.search).get('next');
    // อนุญาตเฉพาะ path ภายในเว็บเดียวกัน กัน open redirect
    if (next && next.startsWith('/') && !next.startsWith('//')) return next;
    return '/';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'กำลังตรวจสอบ…';

    fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
      .then(function (r) {
        if (!r.ok) throw new Error(r.data && r.data.error ? r.data.error : 'เข้าสู่ระบบไม่สำเร็จ');
        location.href = safeNext();
      })
      .catch(function (err) {
        showError(err.message || 'เข้าสู่ระบบไม่สำเร็จ ลองใหม่อีกครั้ง');
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      });
  });
})();
</script>
</body>
</html>
